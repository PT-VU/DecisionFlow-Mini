name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: docker build --tag decisionflow-mini:ci .
      - name: Check public image boundary
        run: |
          test ! -e evaluator_private
          test ! -e runtime
          test ! -e .env
