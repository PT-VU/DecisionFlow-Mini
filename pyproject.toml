[project]
name = "decisionflow-mini"
version = "0.1.0"
description = "A governed, evidence-bound workflow for financial support tickets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
dashboard = ["streamlit>=1.40,<2"]

[project.scripts]
decisionflow = "decisionflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisionflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
